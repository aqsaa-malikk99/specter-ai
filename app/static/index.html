<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Contract Renewal &amp; Risk Radar</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --panel-2: #1e222b;
    --border: #2a2f3a;
    --text: #e6e8ec;
    --muted: #8a91a3;
    --accent: #5b8cff;
    --critical: #ef5350;
    --warn: #f2a93b;
    --info: #4aa3ff;
    --ok: #4caf7d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: baseline;
    gap: 12px;
  }
  header h1 { font-size: 18px; margin: 0; }
  header .tagline { color: var(--muted); font-size: 13px; }
  .layout { display: flex; height: calc(100vh - 57px); }
  aside {
    width: 280px;
    border-right: 1px solid var(--border);
    overflow-y: auto;
    padding: 16px;
    flex-shrink: 0;
  }
  aside h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin: 0 0 12px; }
  .client-item { padding: 8px 10px; border-radius: 6px; cursor: pointer; font-size: 14px; margin-bottom: 2px; }
  .client-item:hover { background: var(--panel-2); }
  .client-item.active { background: var(--accent); color: white; }
  .contract-item { padding: 6px 10px 6px 22px; font-size: 13px; color: var(--muted); cursor: pointer; border-radius: 6px; }
  .contract-item:hover { background: var(--panel-2); color: var(--text); }
  main { flex: 1; overflow-y: auto; padding: 24px; }

  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 20px; margin-bottom: 20px; }
  .panel h2 { font-size: 14px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin: 0 0 14px; }

  form.upload { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; }
  form.upload label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  form.upload input, form.upload select {
    background: var(--panel-2); border: 1px solid var(--border); color: var(--text);
    border-radius: 6px; padding: 8px 10px; font-size: 13px;
  }
  button {
    background: var(--accent); color: white; border: none; border-radius: 6px;
    padding: 9px 16px; font-size: 13px; cursor: pointer; font-weight: 500;
  }
  button:hover { opacity: 0.9; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }

  .status-line { font-size: 13px; color: var(--muted); margin-top: 10px; }
  .status-line.error { color: var(--critical); }

  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .field { margin-bottom: 10px; }
  .field .k { font-size: 11px; text-transform: uppercase; color: var(--muted); letter-spacing: 0.04em; }
  .field .v { font-size: 14px; margin-top: 2px; }

  .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; }
  .badge.critical { background: rgba(239,83,80,0.15); color: var(--critical); border: 1px solid rgba(239,83,80,0.4); }
  .badge.warn { background: rgba(242,169,59,0.15); color: var(--warn); border: 1px solid rgba(242,169,59,0.4); }
  .badge.info { background: rgba(74,163,255,0.15); color: var(--info); border: 1px solid rgba(74,163,255,0.4); }
  .badge.ok { background: rgba(76,175,125,0.15); color: var(--ok); border: 1px solid rgba(76,175,125,0.4); }
  .badge.substantive { background: rgba(239,83,80,0.15); color: var(--critical); border: 1px solid rgba(239,83,80,0.4); }
  .badge.cosmetic { background: rgba(138,145,163,0.15); color: var(--muted); border: 1px solid var(--border); }

  .risk-flag { padding: 10px 12px; border-radius: 8px; background: var(--panel-2); margin-bottom: 8px; border: 1px solid var(--border); }
  .risk-flag .clause-type { font-size: 13px; font-weight: 600; margin-bottom: 4px; }
  .risk-flag .issue { font-size: 13px; color: var(--text); }

  .diff-entry { padding: 10px 12px; border-radius: 8px; background: var(--panel-2); margin-bottom: 8px; border: 1px solid var(--border); }
  .diff-entry .clause-type { font-size: 13px; font-weight: 600; margin-bottom: 6px; }
  .diff-entry .old, .diff-entry .new { font-size: 12px; margin-top: 4px; }
  .diff-entry .old { color: var(--critical); }
  .diff-entry .new { color: var(--ok); }
  .diff-entry .label { color: var(--muted); text-transform: uppercase; font-size: 10px; letter-spacing: 0.04em; margin-right: 6px; }

  .draft-banner {
    display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px;
    background: rgba(242,169,59,0.15); border: 1px solid rgba(242,169,59,0.4);
    color: var(--warn); border-radius: 999px; font-size: 12px; font-weight: 700;
    letter-spacing: 0.03em; text-transform: uppercase; margin-bottom: 14px;
  }
  .draft-banner .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--warn); }
  .draft-note { font-size: 12px; color: var(--muted); margin-top: 10px; }
  .email-subject { font-size: 14px; font-weight: 600; margin-bottom: 8px; }
  .email-body { white-space: pre-wrap; font-size: 13px; line-height: 1.6; background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px; padding: 14px; }

  table.audit { width: 100%; border-collapse: collapse; font-size: 12px; }
  table.audit th { text-align: left; color: var(--muted); text-transform: uppercase; font-size: 10px; letter-spacing: 0.04em; padding: 6px 8px; border-bottom: 1px solid var(--border); }
  table.audit td { padding: 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
  table.audit .hash { font-family: ui-monospace, monospace; color: var(--muted); }

  .empty-state { color: var(--muted); font-size: 13px; padding: 20px 0; text-align: center; }
  a.ics-link { color: var(--accent); font-size: 12px; text-decoration: none; }
  a.ics-link:hover { text-decoration: underline; }
</style>
</head>
<body>

<header>
  <h1>Contract Renewal &amp; Risk Radar</h1>
  <span class="tagline">Nothing here auto-sends, auto-schedules, or auto-approves anything.</span>
</header>

<div class="layout">
  <aside id="sidebar">
    <h2>Clients</h2>
    <div id="client-list"><div class="empty-state">No clients yet — upload a contract to get started.</div></div>
  </aside>

  <main>
    <div class="panel">
      <h2>Upload a contract</h2>
      <form class="upload" id="upload-form">
        <div>
          <label for="file">Contract file (.txt)</label>
          <input type="file" id="file" name="file" accept=".txt" required />
        </div>
        <div>
          <label for="provider">Provider (optional)</label>
          <select id="provider" name="provider">
            <option value="">server default</option>
            <option value="anthropic">anthropic</option>
            <option value="google">google</option>
          </select>
        </div>
        <div>
          <label for="model">Model (optional)</label>
          <input type="text" id="model" name="model" placeholder="e.g. gemini-2.5-flash" />
        </div>
        <button type="submit" id="upload-btn">Run pipeline</button>
      </form>
      <div class="status-line" id="upload-status"></div>
    </div>

    <div id="detail"></div>
  </main>
</div>

<script>
const el = (tag, attrs = {}, children = []) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") e.className = v;
    else if (k === "html") e.innerHTML = v;
    else e.setAttribute(k, v);
  }
  for (const c of [].concat(children)) {
    if (c) e.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
  }
  return e;
};

let activeClientId = null;

async function loadClients() {
  const res = await fetch("/clients");
  const clients = await res.json();
  const list = document.getElementById("client-list");
  list.innerHTML = "";
  if (clients.length === 0) {
    list.appendChild(el("div", { class: "empty-state" }, "No clients yet — upload a contract to get started."));
    return;
  }
  for (const client of clients) {
    const item = el("div", { class: "client-item" }, client.name);
    item.onclick = () => selectClient(client.id, item);
    list.appendChild(item);
  }
}

async function selectClient(clientId, itemEl) {
  document.querySelectorAll(".client-item").forEach(e => e.classList.remove("active"));
  itemEl.classList.add("active");
  activeClientId = clientId;

  const res = await fetch(`/clients/${clientId}/contracts`);
  const contracts = await res.json();
  document.querySelectorAll(".contract-item").forEach(e => e.remove());

  const sorted = contracts.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
  for (const c of sorted) {
    const label = `${c.contract_type || "Contract"} · ${new Date(c.created_at).toLocaleDateString()}`;
    const item = el("div", { class: "contract-item" }, label);
    item.onclick = () => loadContract(c.id);
    itemEl.after(item);
  }
  if (sorted.length) loadContract(sorted[0].id);
}

async function loadContract(contractId) {
  const [contract, auditLog] = await Promise.all([
    fetch(`/contracts/${contractId}`).then(r => r.json()),
    fetch(`/contracts/${contractId}/audit-log`).then(r => r.json()),
  ]);
  renderDetail(contract, auditLog);
}

function severityBadge(sev) {
  return el("span", { class: `badge ${sev}` }, sev);
}

function renderDetail(c, auditLog) {
  const detail = document.getElementById("detail");
  detail.innerHTML = "";

  // --- Overview ---
  const overview = el("div", { class: "panel" });
  overview.appendChild(el("h2", {}, "Overview"));
  const grid = el("div", { class: "grid-2" });
  grid.appendChild(field("Contract type", c.contract_type || "—"));
  grid.appendChild(field("Parties", (c.parties || []).join(" ↔ ") || "—"));
  grid.appendChild(field("Effective date", c.effective_date || "—"));
  grid.appendChild(field("Term length", c.term_length_months ? `${c.term_length_months} months` : "—"));
  overview.appendChild(grid);
  if (c.is_renewal_of) {
    overview.appendChild(el("div", { class: "field" }, [
      el("div", { class: "k" }, "Renewal of"),
      el("div", { class: "v" }, c.is_renewal_of),
    ]));
  }
  detail.appendChild(overview);

  // --- Deadline ---
  const deadlinePanel = el("div", { class: "panel" });
  deadlinePanel.appendChild(el("h2", {}, "Renewal Deadline"));
  if (c.deadline && c.deadline.cancel_by_date) {
    deadlinePanel.appendChild(field("Cancel by", c.deadline.cancel_by_date));
    deadlinePanel.appendChild(field("Reminders", (c.deadline.reminder_dates || []).join(", ") || "—"));
    deadlinePanel.appendChild(field("Reasoning", c.deadline.reasoning || "—"));
    const icsLink = el("a", { class: "ics-link", href: `/contracts/${c.id}/calendar.ics` }, "Download .ics (not added to any calendar automatically)");
    deadlinePanel.appendChild(icsLink);
  } else {
    deadlinePanel.appendChild(el("div", { class: "empty-state" }, "No auto-renewal deadline computed (no auto-renewal clause detected, or dates were missing)."));
  }
  detail.appendChild(deadlinePanel);

  // --- Diff ---
  if (c.diff) {
    const diffPanel = el("div", { class: "panel" });
    diffPanel.appendChild(el("h2", {}, "What Changed Since Prior Version"));
    if ((c.diff.changes || []).length === 0) {
      diffPanel.appendChild(el("div", { class: "empty-state" }, "No substantive differences detected."));
    } else {
      for (const change of c.diff.changes) {
        const entry = el("div", { class: "diff-entry" });
        entry.appendChild(el("div", { class: "clause-type" }, [change.clause_type, " ", severityBadge(change.materiality)]));
        entry.appendChild(el("div", { class: "old" }, [el("span", { class: "label" }, "before"), change.old_value]));
        entry.appendChild(el("div", { class: "new" }, [el("span", { class: "label" }, "after"), change.new_value]));
        diffPanel.appendChild(entry);
      }
    }
    if (c.diff.summary) diffPanel.appendChild(el("div", { class: "draft-note" }, c.diff.summary));
    detail.appendChild(diffPanel);
  }

  // --- Risk flags ---
  const riskPanel = el("div", { class: "panel" });
  riskPanel.appendChild(el("h2", {}, "Flagged Risks"));
  const flags = (c.risk_flags && c.risk_flags.flags) || [];
  if (flags.length === 0) {
    riskPanel.appendChild(el("div", {}, [severityBadge("ok"), el("span", { html: "&nbsp;&nbsp;" }), "Nothing outside the playbook."]));
  } else {
    for (const f of flags) {
      const flagEl = el("div", { class: "risk-flag" });
      flagEl.appendChild(el("div", { class: "clause-type" }, [f.clause_type, " ", severityBadge(f.severity)]));
      flagEl.appendChild(el("div", { class: "issue" }, f.issue));
      riskPanel.appendChild(flagEl);
    }
  }
  if (c.risk_flags && c.risk_flags.summary) {
    riskPanel.appendChild(el("div", { class: "draft-note" }, c.risk_flags.summary));
  }
  detail.appendChild(riskPanel);

  // --- Draft email (never sent) ---
  const emailPanel = el("div", { class: "panel" });
  emailPanel.appendChild(el("h2", {}, "Draft Summary Email"));
  if (c.draft_email) {
    emailPanel.appendChild(el("div", { class: "draft-banner" }, [el("span", { class: "dot" }), "Draft — awaiting human approval"]));
    emailPanel.appendChild(el("div", { class: "email-subject" }, c.draft_email.subject));
    emailPanel.appendChild(el("div", { class: "email-body" }, c.draft_email.body));
    emailPanel.appendChild(el("div", { class: "draft-note" }, "This has not been sent to anyone. A human reviews and sends it manually."));
  } else {
    emailPanel.appendChild(el("div", { class: "empty-state" }, "No draft generated."));
  }
  detail.appendChild(emailPanel);

  // --- Audit log ---
  const auditPanel = el("div", { class: "panel" });
  auditPanel.appendChild(el("h2", {}, "Audit Log — who/what knew this, and when"));
  if (auditLog.length === 0) {
    auditPanel.appendChild(el("div", { class: "empty-state" }, "No audit entries."));
  } else {
    const table = el("table", { class: "audit" });
    const thead = el("tr", {}, [
      el("th", {}, "Agent"),
      el("th", {}, "Timestamp"),
      el("th", {}, "Confidence"),
      el("th", {}, "Input hash"),
    ]);
    table.appendChild(thead);
    for (const row of auditLog) {
      table.appendChild(el("tr", {}, [
        el("td", {}, row.agent_name),
        el("td", {}, new Date(row.created_at).toLocaleString()),
        el("td", {}, row.confidence != null ? row.confidence.toFixed(2) : "—"),
        el("td", { class: "hash" }, row.input_hash.slice(0, 16) + "…"),
      ]));
    }
    auditPanel.appendChild(table);
  }
  detail.appendChild(auditPanel);
}

function field(label, value) {
  return el("div", { class: "field" }, [
    el("div", { class: "k" }, label),
    el("div", { class: "v" }, value),
  ]);
}

document.getElementById("upload-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const fileInput = document.getElementById("file");
  const provider = document.getElementById("provider").value;
  const model = document.getElementById("model").value;
  const status = document.getElementById("upload-status");
  const btn = document.getElementById("upload-btn");

  if (!fileInput.files.length) return;

  const formData = new FormData();
  formData.append("file", fileInput.files[0]);

  const params = new URLSearchParams();
  if (provider) params.set("provider", provider);
  if (model) params.set("model", model);

  btn.disabled = true;
  status.className = "status-line";
  status.textContent = "Running pipeline (intake → extraction → diff → risk → deadline → notify)…";

  try {
    const res = await fetch(`/contracts/upload?${params.toString()}`, { method: "POST", body: formData });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.detail || `HTTP ${res.status}`);
    }
    const result = await res.json();
    status.textContent = `Done. Filed under client_profile_id=${result.client_profile_id}.`;
    await loadClients();
    await loadContract(result.contract_id);
  } catch (err) {
    status.className = "status-line error";
    status.textContent = `Failed: ${err.message}`;
  } finally {
    btn.disabled = false;
  }
});

loadClients();
</script>
</body>
</html>
