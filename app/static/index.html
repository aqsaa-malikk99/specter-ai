<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Specter AI — Contract Renewal &amp; Risk Radar</title>
<link rel="stylesheet" href="/static/styles.css" />
</head>
<body>

<div id="login-screen">
  <div class="login-card neu-raised">
    <div class="mark">SPECTER AI</div>
    <div class="sub">Contract Renewal &amp; Risk Radar</div>
    <form id="login-form">
      <div class="field-group">
        <label for="login-username">Username</label>
        <input type="text" id="login-username" class="neu-inset" autocomplete="username" required />
      </div>
      <div class="field-group">
        <label for="login-password">Password</label>
        <input type="password" id="login-password" class="neu-inset" autocomplete="current-password" required />
      </div>
      <button type="submit" class="gold-btn">Sign in</button>
      <div class="login-error" id="login-error"></div>
    </form>
    <div class="hint">Demo credentials: admin / admin</div>
  </div>
</div>

<div id="app">
  <div class="topbar">
    <div class="brand">
      <span class="mark">SPECTER AI</span>
      <span class="tagline">Contract Renewal &amp; Risk Radar</span>
    </div>
    <div class="topnav" id="topnav">
      <button data-view="workspace" class="active">Workspace</button>
      <button data-view="history">History</button>
      <button data-view="usage">Usage</button>
    </div>
    <div class="user-chip">
      <div class="avatar" id="user-avatar">?</div>
      <span class="name" id="user-name">—</span>
      <button id="logout-btn">Sign out</button>
    </div>
  </div>

  <div class="body-shell">
    <aside class="sidebar">
      <h2>Clients</h2>
      <div id="client-list"><div class="empty-state">No clients yet.</div></div>
    </aside>

    <main class="content">

      <!-- Workspace view -->
      <div class="view active" id="view-workspace">
        <div class="panel neu-raised">
          <h2>📄 Upload a contract</h2>
          <form class="upload-row" id="upload-form">
            <div class="field-group">
              <label>Contract PDF</label>
              <label class="file-drop neu-inset" id="file-drop-label">
                <span class="icon">⤴</span>
                <span id="file-drop-text">Choose a PDF file…</span>
                <input type="file" id="file" name="file" accept=".pdf" required />
              </label>
            </div>
            <div class="field-group">
              <label for="provider">Provider</label>
              <select id="provider" name="provider">
                <option value="">server default</option>
                <option value="anthropic">anthropic</option>
                <option value="google">google</option>
              </select>
            </div>
            <div class="field-group">
              <label for="model">Model</label>
              <input type="text" id="model" name="model" placeholder="optional override" />
            </div>
            <button type="submit" id="upload-btn" class="gold-btn">Run pipeline</button>
          </form>

          <div id="pipeline-block" style="display:none;">
            <div class="stepper" id="stepper"></div>
            <div class="pipeline-caption" id="pipeline-caption"></div>
            <div id="verdict-area"></div>
          </div>

          <div class="upload-status" id="upload-status"></div>
        </div>

        <div id="detail"></div>
      </div>

      <!-- History view -->
      <div class="view" id="view-history">
        <div class="panel neu-raised">
          <h2>🕓 Cross-client audit history</h2>
          <div id="history-table"><div class="empty-state">No activity yet.</div></div>
        </div>
      </div>

      <!-- Usage view -->
      <div class="view" id="view-usage">
        <div class="panel neu-raised">
          <h2>⚡ LLM usage overview</h2>
          <div id="usage-stats"></div>
          <div id="usage-by-agent"></div>
        </div>
      </div>

    </main>
  </div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
